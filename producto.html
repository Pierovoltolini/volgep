<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Producto | VolGep</title>
  <link rel="stylesheet" href="estilos.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    .product-page {
      padding: 2.5rem 0 4rem;
      min-height: 100vh;
    }

    .product-wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .product-back {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      margin-bottom: 1.25rem;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .product-back:hover {
      text-decoration: underline;
    }

    .product-shell {
      background: var(--paper);
      border: 1px solid #e1e9e1;
      border-radius: 18px;
      box-shadow: var(--shadow-1);
      overflow: hidden;
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 0;
    }

    .product-gallery {
      background: linear-gradient(180deg, #f8fbf7 0%, #f2f7f1 100%);
      border-right: 1px solid #e6eee6;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 480px;
    }

    .product-gallery img {
      max-width: 100%;
      max-height: 420px;
      object-fit: contain;
    }

    .product-info {
      padding: 2rem;
    }

    .product-kicker {
      display: inline-block;
      margin-bottom: .85rem;
      padding: .42rem .7rem;
      border-radius: 999px;
      background: #eef6ee;
      border: 1px solid #d7e7d7;
      color: #2f5d35;
      font-size: .85rem;
      font-weight: 700;
    }

    .product-title {
      margin: 0 0 .75rem 0;
      color: var(--text);
      line-height: 1.15;
    }

    .product-meta {
      color: var(--muted);
      font-size: .98rem;
      margin-bottom: 1rem;
    }

    .product-tags {
      display: flex;
      flex-wrap: wrap;
      gap: .55rem;
      margin-bottom: 1.25rem;
    }

    .product-tag {
      display: inline-flex;
      align-items: center;
      padding: .42rem .7rem;
      border-radius: 999px;
      background: #f2f7f2;
      border: 1px solid #d9e7d8;
      color: #2c4a36;
      font-size: .86rem;
      font-weight: 600;
    }

    .product-description {
      color: var(--text);
      line-height: 1.75;
      margin-bottom: 1.4rem;
    }

    .product-card-block {
      background: #fbfcfa;
      border: 1px solid #e4ece4;
      border-radius: 14px;
      padding: 1rem 1rem .85rem;
      margin-bottom: 1.2rem;
    }

    .product-card-block h3 {
      margin-bottom: .7rem;
      color: var(--text);
    }

    /* Tabla de especificaciones técnicas */
    .specs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem;
      margin-top: .25rem;
    }

    .specs-table th,
    .specs-table td {
      padding: .55rem .75rem;
      text-align: left;
      border-top: 1px solid #e4ece4;
      vertical-align: top;
      line-height: 1.5;
    }

    .specs-table th {
      width: 42%;
      color: #2f5d35;
      font-weight: 600;
      white-space: nowrap;
    }

    .specs-table td {
      color: #4a5b50;
    }

    .specs-table__full td {
      color: #4a5b50;
      display: flex;
      gap: .5rem;
      align-items: flex-start;
    }

    .specs-table__full td::before {
      content: '›';
      color: #2e7d32;
      font-weight: 700;
      font-size: 1.05rem;
      flex-shrink: 0;
      line-height: 1.4;
    }

    .specs-table tbody tr:nth-child(even) {
      background: #fafdf9;
    }

    .specs-table tbody tr:hover {
      background: #f2f8f1;
    }

    .product-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 1.25rem;
    }

    .product-loading,
    .product-error {
      max-width: 900px;
      margin: 4rem auto;
      padding: 0 1rem;
      text-align: center;
    }

    .product-error-box {
      background: var(--paper);
      border: 1px solid #e1e9e1;
      border-radius: 18px;
      box-shadow: var(--shadow-1);
      padding: 2rem;
    }

    @media (max-width: 900px) {
      .product-grid {
        grid-template-columns: 1fr;
      }

      .product-gallery {
        border-right: 0;
        border-bottom: 1px solid #e6eee6;
        min-height: 280px;
        padding: 1.5rem;
      }

      .product-gallery img {
        max-height: 240px;
      }

      .product-info {
        padding: 1.35rem;
      }

      .product-actions .btn {
        width: 100%;
      }
    }

    @media (max-width: 600px) {
      .product-page {
        padding: 1.25rem 0 2.5rem;
      }

      .product-wrap {
        padding: 0 .75rem;
      }

      .product-shell {
        border-radius: 12px;
      }

      .product-gallery {
        min-height: 220px;
        padding: 1.25rem;
      }

      .product-gallery img {
        max-height: 200px;
      }

      .product-info {
        padding: 1rem;
      }

      .product-title {
        font-size: 1.4rem;
      }

      .product-card-block {
        padding: .85rem .85rem .7rem;
        border-radius: 10px;
      }

      .product-card-block h3 {
        font-size: .95rem;
      }

      .product-back {
        margin-bottom: .85rem;
        font-size: .88rem;
      }
    }

    @media (max-width: 400px) {
      .product-gallery {
        min-height: 180px;
        padding: 1rem;
      }

      .product-gallery img {
        max-height: 170px;
      }

      .product-title {
        font-size: 1.2rem;
      }

      .product-info {
        padding: .85rem;
      }
    }
  </style>
</head>
<body>
  <main class="product-page">
    <div id="product-content" class="product-loading">
      <p>Cargando producto...</p>
    </div>
  </main>

  <script src="producto.js"></script>
</body>
</html>
